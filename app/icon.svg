<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tiled background -->
  <rect width="64" height="64" rx="14" fill="#EEF9FB" stroke="#0B2A36" stroke-width="3.5" />
  <path d="M32 3V61M3 32H61" stroke="#BFE3EA" stroke-width="2" />
  <!-- Water splash base -->
  <path d="M8 46 Q20 40 32 46 T56 46 L56 54 Q56 59 50 59 L14 59 Q8 59 8 54 Z" fill="#3CC0D8" />
  <!-- Pip the otter's ears -->
  <circle cx="17" cy="28" r="5.5" fill="#7A4E2D" stroke="#0B2A36" stroke-width="3" />
  <circle cx="47" cy="28" r="5.5" fill="#7A4E2D" stroke="#0B2A36" stroke-width="3" />
  <!-- Pip's head -->
  <ellipse cx="32" cy="36" rx="16" ry="14" fill="#7A4E2D" stroke="#0B2A36" stroke-width="3" />
  <!-- Lighter muzzle -->
  <ellipse cx="32" cy="40" rx="10" ry="7" fill="#EBD3BE" />
  <!-- Swim cap -->
  <path d="M16 32 C16 17 48 17 48 32 Z" fill="#FFD23F" stroke="#0B2A36" stroke-width="3" stroke-linejoin="round" />
  <!-- Wet highlight crescent on cap -->
  <path d="M23 23 Q28 19 34 20" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
  <!-- Goggles resting on cap -->
  <rect x="20" y="25" width="10" height="6.5" rx="3" fill="#3CC0D8" stroke="#0B2A36" stroke-width="2.5" />
  <rect x="34" y="25" width="10" height="6.5" rx="3" fill="#3CC0D8" stroke="#0B2A36" stroke-width="2.5" />
  <line x1="30" y1="28" x2="34" y2="28" stroke="#0B2A36" stroke-width="2.5" />
  <!-- Eyes & nose -->
  <circle cx="26" cy="36" r="2" fill="#0B2A36" />
  <circle cx="38" cy="36" r="2" fill="#0B2A36" />
  <ellipse cx="32" cy="39.5" rx="3.2" ry="2.2" fill="#0B2A36" />
  <path d="M29 43 Q32 45.5 35 43" fill="none" stroke="#0B2A36" stroke-width="2.2" stroke-linecap="round" />
</svg>
